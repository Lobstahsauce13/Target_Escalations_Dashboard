# A Worker that only serves the site's files (no server code). Cloudflare's Git integration (Workers Builds)
# deploys it on every push to main; the name must match that Worker. .assetsignore keeps repo files off the site.
name = "target-escalations-dashboard"
compatibility_date = "2026-10-01"

[assets]
directory = "."

# Preview builds (non-main branches) run "wrangler preview", which refuses to run without this block. Empty = inherit the settings above.
[previews]
