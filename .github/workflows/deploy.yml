name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upload only the site, not the repo's .git or workflow files.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html visits.html xlsx.full.min.js _site/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Publishes _site to the Worker named in wrangler.toml.
        run: npx --yes wrangler@4 deploy
